<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>atlas-editor</title>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/button.css">
    <link rel="stylesheet" href="styles/topbar.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/groups.css">
    <link rel="stylesheet" href="styles/view.css">
</head>
<body>
    
    <div class="app-wrapper">
        <header class="top-bar">
            <div class="top-bar-left">
                <button id="save">💾 Save</button>
                <button id="load">📥 Load</button>
                <button id="openImage">🌄 Open Image</button>
            </div>
            <div class="top-bar-center">
                <span class="top-hints">LMB Drag to select · Enter create crop · Enter+Number insert at N · RMB delete · MMB pan · Scroll zoom</span>
            </div>
            <div class="top-bar-right">
                <label class="grid-label">Grid</label>
                <input type="number" id="gridSize" class="grid-input" value="16" min="1" step="1">
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar" id="sidebar">
                <div class="groups-panel">
                    <div class="group-actions">
                        <button id="addGroupBtn">➕ Add Group</button>
                        <span class="group-actions-spacer"></span>
                        <button id="foldAllBtn" title="Fold all prefix sections">⊟ Fold All</button>
                        <button id="unfoldAllBtn" title="Unfold all prefix sections">⊞ Unfold All</button>
                    </div>
                    <div class="group-list" id="groupList"></div>
                    <div class="preview-resizer" id="previewResizer" style="display:none"></div>
                    <div class="preview-panel" id="previewPanel" style="display:none">
                        <div class="preview-controls">
                            <span class="preview-left-group">
                                <button id="previewToggle" title="Play/Pause">▶</button>
                                <span class="preview-crop-label" id="previewCropLabel"></span>
                            </span>
                            <span class="preview-speed-group">
                                <span class="preview-label">⏱</span>
                                <input type="range" id="previewSpeed" value="8" min="0" max="20" step="0.2" class="preview-speed-slider">
                                <span class="preview-speed-val" id="previewSpeedVal">8 FPS</span>
                            </span>
                            <label class="preview-loop"><input type="checkbox" id="previewLoop" checked> ↻</label>
                        </div>
                        <div class="preview-canvas-wrap">
                            <canvas class="preview-canvas" id="previewCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </aside>

            <div class="resizer" id="dragbar"></div>

            <main class="editor-view">
                <canvas id="view"></canvas>
            </main>
        </div>
    </div>

    <script src="scripts/global.js"></script>
    <script src="scripts/camera.js"></script>
    <script src="scripts/draw.js"></script>
    <script src="scripts/sidebar.js"></script>
    <script src="scripts/groups.js"></script>
    <script src="scripts/io.js"></script>
    <script src="scripts/interact.js"></script>

</body>
</html>
